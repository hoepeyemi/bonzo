# Build and push Docker images for web + mcp-server; deploy to Ubuntu host over SSH.
#
# Required GitHub secrets:
#   DOCKER_USERNAME_PROD, DOCKER_HUB_ACCESS_TOKEN_PROD
#   SSH_HOST_TEMP, SSH_USERNAME_TEMP, SSH_PRIVATE_TEMP
#   NEXT_PUBLIC_REOWN_PROJECT_ID
#
# Optional GitHub secrets for the web build:
#   NEXT_PUBLIC_APP_URL
#   NEXT_PUBLIC_MCP_URL
#     Recommended for single-domain connector logging:
#     set this to the public web origin, for example https://app.example.com.
#   NEXT_PUBLIC_CHAIN_ID
#   NEXT_PUBLIC_USDCE_ADDRESS
#   NEXT_PUBLIC_X402_FACILITATOR_URL
#   NEXT_PUBLIC_SOMNIA_AGENT_BRIDGE_ADDRESS
#   NEXT_PUBLIC_JSON_API_AGENT_ID
#
# Runtime env files live on the Ubuntu host:
#   /home/ubuntu/bottie/.env.web
#   /home/ubuntu/bottie/.env.mcp
#
# For connector observability, set:
#   .env.web: NEXT_PUBLIC_MCP_URL=https://your-web-origin
#   .env.mcp: NEXT_APP_URL=https://your-web-origin
#   .env.mcp: MCP_PUBLIC_URL=https://your-web-origin

name: Build and Deploy Bonzo (web + mcp-server)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME_PROD }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN_PROD }}
  HOST: ${{ secrets.SSH_HOST_TEMP }}
  HOST_USERNAME: ${{ secrets.SSH_USERNAME_TEMP }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_TEMP }}
  WEB_IMAGE: ${{ secrets.DOCKER_USERNAME_PROD }}/bonzo-web:latest
  MCP_IMAGE: ${{ secrets.DOCKER_USERNAME_PROD }}/bonzo-mcp:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build web image (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: bonzo-web:pr
          build-args: |
            NEXT_PUBLIC_REOWN_PROJECT_ID=${{ secrets.NEXT_PUBLIC_REOWN_PROJECT_ID }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_MCP_URL=${{ secrets.NEXT_PUBLIC_MCP_URL }}
            NEXT_PUBLIC_CHAIN_ID=${{ secrets.NEXT_PUBLIC_CHAIN_ID }}
            NEXT_PUBLIC_USDCE_ADDRESS=${{ secrets.NEXT_PUBLIC_USDCE_ADDRESS }}
            NEXT_PUBLIC_X402_FACILITATOR_URL=${{ secrets.NEXT_PUBLIC_X402_FACILITATOR_URL }}
            NEXT_PUBLIC_SOMNIA_AGENT_BRIDGE_ADDRESS=${{ secrets.NEXT_PUBLIC_SOMNIA_AGENT_BRIDGE_ADDRESS }}
            NEXT_PUBLIC_JSON_API_AGENT_ID=${{ secrets.NEXT_PUBLIC_JSON_API_AGENT_ID }}

      - name: Build MCP image (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: false
          tags: bonzo-mcp:pr

      - name: Build and push web image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ env.WEB_IMAGE }}
          build-args: |
            NEXT_PUBLIC_REOWN_PROJECT_ID=${{ secrets.NEXT_PUBLIC_REOWN_PROJECT_ID }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_MCP_URL=${{ secrets.NEXT_PUBLIC_MCP_URL }}
            NEXT_PUBLIC_CHAIN_ID=${{ secrets.NEXT_PUBLIC_CHAIN_ID }}
            NEXT_PUBLIC_USDCE_ADDRESS=${{ secrets.NEXT_PUBLIC_USDCE_ADDRESS }}
            NEXT_PUBLIC_X402_FACILITATOR_URL=${{ secrets.NEXT_PUBLIC_X402_FACILITATOR_URL }}
            NEXT_PUBLIC_SOMNIA_AGENT_BRIDGE_ADDRESS=${{ secrets.NEXT_PUBLIC_SOMNIA_AGENT_BRIDGE_ADDRESS }}
            NEXT_PUBLIC_JSON_API_AGENT_ID=${{ secrets.NEXT_PUBLIC_JSON_API_AGENT_ID }}
          cache-from: type=gha,scope=bonzo-web
          cache-to: type=gha,mode=max,scope=bonzo-web

      - name: Build and push MCP image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ${{ env.MCP_IMAGE }}
          cache-from: type=gha,scope=bonzo-mcp
          cache-to: type=gha,mode=max,scope=bonzo-mcp

      - name: Deploy to Ubuntu server
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.HOST }}
          username: ${{ env.HOST_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "Deployment started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

            APP_DIR=/home/ubuntu/bottie
            WEB_ENV=$APP_DIR/.env.web
            MCP_ENV=$APP_DIR/.env.mcp
            MCP_INTERNAL_URL=http://bottie-mcp-server:3001

            if [ ! -f "$WEB_ENV" ]; then
              echo "ERROR: Missing web env file: $WEB_ENV"
              exit 1
            fi
            if [ ! -f "$MCP_ENV" ]; then
              echo "ERROR: Missing MCP env file: $MCP_ENV"
              exit 1
            fi

            echo "Normalizing env file line endings..."
            sudo sed -i 's/\r$//' "$WEB_ENV" "$MCP_ENV"

            echo "Checking env file syntax..."
            if grep -nE '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]+=' "$WEB_ENV" "$MCP_ENV"; then
              echo "ERROR: Env keys must not contain spaces before '='. Example: use CHAIN_ID=50312, not CHAIN_ID =50312."
              exit 1
            fi

            WEB_PUBLIC_MCP_URL=$(grep -E '^NEXT_PUBLIC_MCP_URL=' "$WEB_ENV" | tail -n 1 | cut -d= -f2- || true)
            WEB_PUBLIC_APP_URL=$(grep -E '^NEXT_PUBLIC_APP_URL=' "$WEB_ENV" | tail -n 1 | cut -d= -f2- || true)
            WEB_USDCE_ADDRESS=$(grep -E '^NEXT_PUBLIC_USDCE_ADDRESS=' "$WEB_ENV" | tail -n 1 | cut -d= -f2- || true)
            MCP_PUBLIC_URL=$(grep -E '^MCP_PUBLIC_URL=' "$MCP_ENV" | tail -n 1 | cut -d= -f2- || true)
            MCP_NEXT_APP_URL=$(grep -E '^NEXT_APP_URL=' "$MCP_ENV" | tail -n 1 | cut -d= -f2- || true)
            MCP_USDCE_ADDRESS=$(grep -E '^(USDCE_ADDRESS|NEXT_PUBLIC_USDCE_ADDRESS)=' "$MCP_ENV" | tail -n 1 | cut -d= -f2- || true)

            CANONICAL_PUBLIC_URL="${WEB_PUBLIC_APP_URL:-$WEB_PUBLIC_MCP_URL}"
            if [ -z "$CANONICAL_PUBLIC_URL" ]; then
              echo "ERROR: Set NEXT_PUBLIC_APP_URL or NEXT_PUBLIC_MCP_URL in $WEB_ENV."
              exit 1
            fi

            if [ -n "$WEB_PUBLIC_MCP_URL" ] && [ "$WEB_PUBLIC_MCP_URL" != "$CANONICAL_PUBLIC_URL" ]; then
              echo "ERROR: NEXT_PUBLIC_MCP_URL in .env.web must match the canonical public web origin."
              echo "  NEXT_PUBLIC_APP_URL=$WEB_PUBLIC_APP_URL"
              echo "  NEXT_PUBLIC_MCP_URL=$WEB_PUBLIC_MCP_URL"
              exit 1
            fi
            if [ -n "$MCP_PUBLIC_URL" ] && [ "$MCP_PUBLIC_URL" != "$CANONICAL_PUBLIC_URL" ]; then
              echo "ERROR: MCP_PUBLIC_URL in .env.mcp must match the canonical public web origin."
              echo "  canonical=$CANONICAL_PUBLIC_URL"
              echo "  MCP_PUBLIC_URL=$MCP_PUBLIC_URL"
              exit 1
            fi
            if [ -n "$MCP_NEXT_APP_URL" ] && [ "$MCP_NEXT_APP_URL" != "$CANONICAL_PUBLIC_URL" ]; then
              echo "ERROR: NEXT_APP_URL in .env.mcp must match the canonical public web origin."
              echo "  canonical=$CANONICAL_PUBLIC_URL"
              echo "  NEXT_APP_URL=$MCP_NEXT_APP_URL"
              exit 1
            fi

            if ! grep -q '^SERVER_PUBLIC_KEY=.*BEGIN PUBLIC KEY' "$WEB_ENV"; then
              echo "WARNING: SERVER_PUBLIC_KEY in .env.web does not visibly contain BEGIN PUBLIC KEY."
              echo "WARNING: If it is not base64-encoded PEM, /api/crypto/public-key will fail."
            fi
            if ! grep -q '^SERVER_PRIVATE_KEY=.*BEGIN PRIVATE KEY' "$WEB_ENV" "$MCP_ENV"; then
              echo "WARNING: SERVER_PRIVATE_KEY does not visibly contain BEGIN PRIVATE KEY in one or both env files."
              echo "WARNING: If it is not base64-encoded PEM, encrypted session/proxy flows will fail."
            fi
            WEB_USDCE_ADDRESS_LC=$(printf '%s' "$WEB_USDCE_ADDRESS" | tr '[:upper:]' '[:lower:]')
            MCP_USDCE_ADDRESS_LC=$(printf '%s' "$MCP_USDCE_ADDRESS" | tr '[:upper:]' '[:lower:]')
            if [ -n "$WEB_USDCE_ADDRESS" ] && [ -n "$MCP_USDCE_ADDRESS" ] && [ "$WEB_USDCE_ADDRESS_LC" != "$MCP_USDCE_ADDRESS_LC" ]; then
              echo "ERROR: MCP payment token address must match the web app payment token address."
              echo "  .env.web NEXT_PUBLIC_USDCE_ADDRESS=$WEB_USDCE_ADDRESS"
              echo "  .env.mcp USDCE_ADDRESS/NEXT_PUBLIC_USDCE_ADDRESS=$MCP_USDCE_ADDRESS"
              exit 1
            fi
            if [ -n "$WEB_USDCE_ADDRESS" ] && [ -z "$MCP_USDCE_ADDRESS" ]; then
              echo "WARNING: .env.web sets NEXT_PUBLIC_USDCE_ADDRESS but .env.mcp does not."
              echo "WARNING: MCP will fall back to the token approved in the session, but setting USDCE_ADDRESS in .env.mcp is recommended."
            fi

            echo "Creating Docker network if missing..."
            sudo docker network create bottie-net >/dev/null 2>&1 || true

            echo "Stopping old containers..."
            sudo docker stop bottie-web bottie-mcp-server || true
            sudo docker rm bottie-web bottie-mcp-server || true

            echo "Pulling latest images..."
            sudo docker pull ${{ env.WEB_IMAGE }}
            sudo docker pull ${{ env.MCP_IMAGE }}

            echo "Starting MCP server..."
            sudo docker run -d \
              --name bottie-mcp-server \
              --restart unless-stopped \
              --network bottie-net \
              -p 3001:3001 \
              --env-file "$MCP_ENV" \
              ${{ env.MCP_IMAGE }}

            echo "Starting web app..."
            sudo docker run -d \
              --name bottie-web \
              --restart unless-stopped \
              --network bottie-net \
              -p 3000:3000 \
              --env-file "$WEB_ENV" \
              -e MCP_INTERNAL_URL="$MCP_INTERNAL_URL" \
              ${{ env.WEB_IMAGE }}

            echo "Verifying deployment..."
            sleep 10

            if ! sudo docker ps --format '{{.Names}}' | grep -q '^bottie-web$'; then
              echo "ERROR: Web container failed to start"
              sudo docker logs bottie-web || true
              exit 1
            fi

            if ! sudo docker ps --format '{{.Names}}' | grep -q '^bottie-mcp-server$'; then
              echo "ERROR: MCP container failed to start"
              sudo docker logs bottie-mcp-server || true
              exit 1
            fi

            echo "Checking web-to-MCP internal connectivity..."
            if ! sudo docker exec bottie-web wget -qO- "$MCP_INTERNAL_URL/health" >/dev/null; then
              echo "ERROR: Web container cannot reach MCP server at $MCP_INTERNAL_URL"
              sudo docker logs --tail 80 bottie-web || true
              sudo docker logs --tail 80 bottie-mcp-server || true
              exit 1
            fi

            echo "Checking proxied MCP connector path..."
            CANONICAL_HOST=$(printf '%s\n' "$CANONICAL_PUBLIC_URL" | sed -E 's#^https?://([^/]+).*#\1#')
            PROXY_RESPONSE=$(sudo docker exec bottie-web wget --header="Host: $CANONICAL_HOST" -qSO- http://localhost:3000/mcp/bonzomcp 2>&1 >/dev/null || true)
            PROXY_STATUS=$(printf '%s\n' "$PROXY_RESPONSE" | awk '/^[[:space:]]*HTTP\/[0-9.]+/ { code=$2 } END { print code }')
            if [ "$PROXY_STATUS" != "401" ]; then
              echo "ERROR: Expected /mcp/bonzomcp through web to return 401 before OAuth, got: $PROXY_STATUS"
              sudo docker logs --tail 80 bottie-web || true
              sudo docker logs --tail 80 bottie-mcp-server || true
              exit 1
            fi

            echo "OK: Both containers are running"
            echo "Web logs:"
            sudo docker logs --tail 30 bottie-web
            echo "MCP logs:"
            sudo docker logs --tail 30 bottie-mcp-server
            echo "Deployment completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Post-deploy verification
        if: github.event_name == 'push' && success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.HOST }}
          username: ${{ env.HOST_USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            if sudo docker ps --format '{{.Names}}' | grep -q '^bottie-web$'; then
              echo "Web container status:"
              sudo docker inspect bottie-web --format='Status: {{.State.Status}} | Started At: {{.State.StartedAt}}'
              sudo docker port bottie-web
            else
              echo "ERROR: bottie-web is not running"
              exit 1
            fi

            if sudo docker ps --format '{{.Names}}' | grep -q '^bottie-mcp-server$'; then
              echo "MCP container status:"
              sudo docker inspect bottie-mcp-server --format='Status: {{.State.Status}} | Started At: {{.State.StartedAt}}'
              sudo docker port bottie-mcp-server
            else
              echo "ERROR: bottie-mcp-server is not running"
              exit 1
            fi
